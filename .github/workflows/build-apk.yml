name: 📦 Build APK Debug

on:
  workflow_dispatch:
    inputs:
      flavor:
        description: "Flavor a compilar"
        required: true
        type: choice
        default: foss
        options: [ foss, gms, izzy ]

permissions:
  contents: read

concurrency:
  group: apk-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: APK ${{ inputs.flavor }} debug
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FLAVOR: ${{ inputs.flavor }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 21 (jvmToolchain del proyecto)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Caché de Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Keystore de debug (los runners no lo traen)
        shell: bash
        run: |
          set -euo pipefail
          KS="${HOME}/.android/debug.keystore"
          if [ ! -f "$KS" ]; then
            mkdir -p "${HOME}/.android"
            # El build.gradle.kts apunta storeFile a esta ruta exacta y con
            # storePassword/keyPassword "android" y alias "androiddebugkey",
            # así que AGP no la autocrea y validateSigning fallaría.
            keytool -genkeypair \
              -keystore "$KS" -storetype PKCS12 \
              -storepass android -keypass android \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          echo "Keystore listo:"
          keytool -list -keystore "$KS" -storepass android 2>/dev/null | head -5

      - name: Plataforma Android (compileSdk 37)
        shell: bash
        run: |
          set -uo pipefail
          SM="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SM" ]; then
            yes | "$SM" --licenses > /dev/null 2>&1 || true
            "$SM" "platforms;android-37" \
              || echo "::warning::No se pudo preinstalar platforms;android-37; AGP intentará descargarlo solo"
          else
            echo "::warning::sdkmanager no encontrado; AGP descargará la plataforma si hace falta"
          fi

      - name: Compilar APK debug
        shell: bash
        env:
          # versionName queda como 13.7.0+<sha> (el build script exige 7-40 hex)
          METROLIST_BUILD_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          TASK="assemble${FLAVOR^}Debug"
          echo "Tarea Gradle: :app:${TASK}"
          chmod +x ./gradlew
          ./gradlew ":app:${TASK}" --stacktrace

      - name: Localizar APK y huella SHA-256
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t APKS < <(find app/build/outputs/apk -name '*.apk' -type f | sort)
          if [ "${#APKS[@]}" -eq 0 ]; then
            echo "::error::No se generó ningún APK"
            exit 1
          fi
          echo "APKs: ${#APKS[@]}"
          ls -lh "${APKS[@]}"
          sha256sum "${APKS[@]}"

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: miliMusic-${{ env.FLAVOR }}-debug
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Resumen de la ejecución
        shell: bash
        run: |
          {
            echo "## 📦 APK debug generado"
            echo ""
            echo "- Flavor: \`${FLAVOR}\`"
            echo "- ApplicationId: \`com.metrolist.music.debug\`"
            echo "- Commit: \`${GITHUB_SHA:0:7}\`"
            echo ""
            echo '```'
            find app/build/outputs/apk -name '*.apk' -type f -exec ls -lh {} \;
            find app/build/outputs/apk -name '*.apk' -type f -exec sha256sum {} \;
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
